<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiro JavaScript</title>
    <style>
        body {
            background-color: rgba(65, 65, 248, 0.801);
            color: white;
            font-family: Arial;
            font-size: 20px;
        }
        h1 {
            color: navy;
        }
    </style>
</head>
<body>
    <h1>
        Olá Mundo
    </h1>
    <p>Primeiro código em JavaScript</p>
    <script>
        const n1 = Number(prompt('Digite um número: ')) // String
        const n2 = Number(prompt('Digite outro número: ')) // String
        var s = n1 + n2
        alert(`A soma entre ${n1} e ${n2} é ${s}`) // Concatenação 
        // (number + number) para adição
        // (string + string) para concatenação
    </script>
</body>
</html>
