<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voce é de onde?</title>
</head>
<body>
    <h1>
        De qual pais voce é?
    </h1>
    Digite seu pais: <input type="text" name="txtpais" id="txtpais" >
    <input type="button" value="Verificar" onclick="verificar()">
    <div id="res"></div>
</body>
    <script>
        function verificar () {
            var txtpais = document.querySelector('input#txtpais')
            var res = document.querySelector('div#res')
            var pais = txtpais.value
            res.innerHTML = `<p>Você é do <strong>${pais}</strong></p>`
            if (pais == 'Brasil') {
                res.innerHTML += `<p>Você é brasileiro!</p>`
            } else {
                res.innerHTML += `<p>Você é estrangeiro!</p>`
            }
        }
    </script>
</html>
